name: Android release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npm test

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.name.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .expo.version app.json)-main.${GITHUB_SHA::7}"
          fi
          jq --arg v "$VERSION" --argjson c "$GITHUB_RUN_NUMBER" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/ja1-uno-${{ steps.version.outputs.version }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/ja1-uno-${{ steps.version.outputs.version }}.apk"
          rm -f "$KS"

      - name: Name APK
        id: name
        run: echo "apk=ja1-uno-${{ steps.version.outputs.version }}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/ja1-uno-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish rolling pre-release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          gh release delete latest-main --cleanup-tag --yes || true
          printf 'Automated build of main at %s.\n\nInstall: download the APK on an Android phone, allow installs from unknown sources, and open it.\n\nLatest commit:\n%s\n' \
            "${GITHUB_SHA::7}" "$COMMIT_MSG" > notes.md
          gh release create latest-main --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build (${GITHUB_SHA::7})" --notes-file notes.md ./*.apk

      - name: Publish GitHub release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "$GITHUB_REF_NAME" ./*.apk
